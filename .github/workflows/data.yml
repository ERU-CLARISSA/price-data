# 価格データの取り込み：取得 → 変換 → チェック → GitHub Pages に配信（週 1 回）
# 事前の設定：
#   - Settings → Pages → Source を「GitHub Actions」にする
#   - Settings → Secrets and variables → Actions に ESTAT_APP_ID（e-Stat の appId）を登録する
# 失敗すると GitHub から（Actions の通知設定に従って）メールが届く。
name: data

on:
  schedule:
    - cron: "0 21 * * 2" # 毎週水曜 6:00（日本時間）。農水省の週次は原則火曜公表
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["pipeline/**", ".github/workflows/data.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      partial: ${{ steps.build.outputs.partial }}
    defaults:
      run:
        working-directory: pipeline
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pipeline/requirements.txt
      - run: pip install -r requirements.txt
      - name: テスト
        run: python -m unittest discover -s tests -t .
      - name: 取得・変換・チェック
        id: build
        env:
          PREVIOUS: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
        run: |
          set +e
          python build.py --out ../site --previous "$PREVIOUS" --require-estat
          code=$?
          cat ../site/report.md >> "$GITHUB_STEP_SUMMARY" 2>/dev/null
          # 2 = 一部の失敗（前回のデータで補って配信する）。それ以外のエラーは配信しない
          if [ $code -eq 2 ]; then echo "partial=true" >> "$GITHUB_OUTPUT"; exit 0; fi
          exit $code
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

  # 一部の取り込みに失敗したら、配信のあとで赤くして知らせる（詳細は build の Summary）
  notify:
    needs: [build, deploy]
    if: needs.build.outputs.partial == 'true'
    runs-on: ubuntu-latest
    steps:
      - run: |
          echo "一部の取り込みに失敗しました。build ジョブの Summary（report.md）を見てください。"
          exit 1

  # 公開リポジトリは 60 日間 commit がないと、GitHub が週 1 回の自動実行を止める。
  # それを防ぐため、毎月最初の水曜（1〜7 日）の自動実行で keepalive.txt を書き換えて commit する。
  # GITHUB_TOKEN の commit では、このワークフローはもう一度動かない。
  keepalive:
    needs: deploy
    if: github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: |
          day=$(TZ=Asia/Tokyo date +%-d)
          if [ "$day" -gt 7 ]; then echo "今月はもう書いた（$day 日）"; exit 0; fi
          echo "最後の自動実行の月：$(TZ=Asia/Tokyo date +%Y-%m)（60 日間 commit がないと自動実行が止まるのを防ぐためのファイル）" > keepalive.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add keepalive.txt
          git diff --cached --quiet && exit 0
          git commit -m "keepalive $(TZ=Asia/Tokyo date +%Y-%m)"
          git push
